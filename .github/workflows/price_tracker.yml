name: Amazon Price Tracker

permissions:
  contents: write
  
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:  # Allows you to manually trigger it from the GitHub UI

jobs:
  track-price:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        run: python scraper.py

      - name: Upload price history as artifact
        uses: actions/upload-artifact@v4
        with:
          name: price-history-csv
          path: price_history.csv

      - name: Upload debug HTML as artifact
        uses: actions/upload-artifact@v4
        with:
          name: debug-response-html
          path: debug_response.html

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add price_history.csv
          git commit -m "Automated price update"
          git push